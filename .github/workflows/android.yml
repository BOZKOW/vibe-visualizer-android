# Builds the app and publishes the APK on the Releases page when a tag like android-v0.24.0 is pushed. Every push to
# main is test-built too; it can also be started by hand from the Actions tab.
# The APK is signed with the release key in the repo secrets (the same key as before, so it installs over the app).
name: Build Android app
on:
  push:
    tags: ["android-v*"]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Release key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/vv.p12"; echo "VV_KEYSTORE=$RUNNER_TEMP/vv.p12" >> "$GITHUB_ENV"; else echo "No release key set: signing with a debug key."; fi
      - name: Build
        env:
          VV_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          # the version from the tag; the build number from the version (0.24.0 → 124000), so it always counts up
          case "$GITHUB_REF_NAME" in
            android-v*) export VV_VERSION_NAME="${GITHUB_REF_NAME#android-v}"
              IFS=. read -r MA MI PA <<< "${VV_VERSION_NAME%%-*}"; export VV_VERSION_CODE=$((100000 + MA * 1000000 + MI * 1000 + ${PA:-0}));;
            *) export VV_VERSION_NAME="1.0.$GITHUB_RUN_NUMBER-dev"; export VV_VERSION_CODE=100000;;
          esac
          echo "VV_VER=$VV_VERSION_NAME" >> "$GITHUB_ENV"; echo "Version $VV_VERSION_NAME ($VV_VERSION_CODE)"
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace   # the unit tests first: a failing one stops the release
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/vibe-visualizer-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-visualizer-android
          path: out/vibe-visualizer-android.apk
      - if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vibe Visualizer for Android ${{ env.VV_VER }}${{ (startsWith(github.ref_name, 'android-v0.') || contains(github.ref_name, '-')) && ' beta' || '' }}
          prerelease: ${{ startsWith(github.ref_name, 'android-v0.') || contains(github.ref_name, '-') }}   # below 1.0 the app is a beta
          body_path: RELEASE_NOTES.md   # the notes for this version (also shown in the app's "What's new")
          files: out/vibe-visualizer-android.apk
